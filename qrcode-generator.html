<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code 產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c84b31;
    --mid: #4a4e69;
    --light: #e8e2d5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .page-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .page-header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .page-header p {
    font-size: 0.9rem;
    color: var(--mid);
  }

  .card {
    background: #fff;
    border: 2px solid var(--ink);
    padding: 2.5rem;
    max-width: 480px;
    width: 100%;
    box-shadow: 6px 6px 0px var(--ink);
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    color: var(--mid);
  }

  textarea {
    width: 100%;
    border: 2px solid var(--ink);
    padding: 0.8rem 1rem;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem;
    resize: vertical;
    min-height: 100px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 1.5rem;
  }

  textarea:focus { border-color: var(--accent); }

  .input-group {
    margin-bottom: 1.5rem;
  }

  input[type="text"] {
    width: 100%;
    border: 2px solid var(--ink);
    padding: 0.75rem 1rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  button {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 0.9rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  button:hover {
    background: var(--accent);
    border-color: var(--accent);
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0px var(--ink);
  }

  .qr-section {
    margin-top: 2rem;
    text-align: center;
    display: none;
  }

  .qr-section.visible { display: block; }

  .qr-label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 1rem;
    font-family: 'Space Mono', monospace;
  }

  #qrcode {
    display: inline-block;
    padding: 1rem;
    background: #fff;
    border: 2px solid var(--ink);
  }

  .url-display {
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--light);
    border: 1px solid var(--ink);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    word-break: break-all;
    color: var(--mid);
  }

  .divider {
    border: none;
    border-top: 2px solid var(--light);
    margin: 2rem 0;
  }

  .hint {
    font-size: 0.8rem;
    color: var(--mid);
    margin-top: 1rem;
    line-height: 1.6;
  }

  .hint a {
    color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>QR Code 問卷產生器</h1>
  <p>設定問卷內容，產生掃描連結</p>
</div>

<div class="card">
  <div class="input-group">
    <label>問卷敘述 / 題目</label>
    <textarea id="description" placeholder="請輸入您想讓受訪者看到的敘述或問題內容…">本次活動的整體安排讓我感到滿意，包含場地、流程與工作人員的服務品質。</textarea>
  </div>

  <div class="input-group">
    <label>問卷頁面 URL（survey.html 的實際網址）</label>
    <input type="text" id="baseUrl" placeholder="https://yoursite.com/survey.html" value="">
    <p class="hint" style="margin-top:0.5rem;">
      請將 <strong>survey.html</strong> 上傳到您的主機，並填入其完整網址。<br>
      若在本機測試，可輸入 <code>file:///path/to/survey.html</code>
    </p>
  </div>

  <button onclick="generateQR()">產生 QR Code</button>

  <div class="qr-section" id="qrSection">
    <hr class="divider">
    <p class="qr-label">掃描此 QR Code 進入問卷</p>
    <div id="qrcode"></div>
    <div class="url-display" id="urlDisplay"></div>
    <p class="hint">受訪者掃描後將直接進入問卷頁面，並看到您設定的敘述。</p>
  </div>
</div>

<script>
  let qrInstance = null;

  // Pre-fill with current page's origin as hint
  const loc = window.location;
  if (loc.protocol !== 'file:') {
    document.getElementById('baseUrl').value = loc.origin + loc.pathname.replace('qrcode-generator.html', 'survey.html');
  }

  function generateQR() {
    const desc = document.getElementById('description').value.trim();
    const base = document.getElementById('baseUrl').value.trim();

    if (!desc) { alert('請輸入問卷敘述！'); return; }
    if (!base) { alert('請輸入 survey.html 的網址！'); return; }

    const url = base + '?desc=' + encodeURIComponent(desc);

    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = '';

    qrInstance = new QRCode(qrDiv, {
      text: url,
      width: 200,
      height: 200,
      colorDark: '#1a1a2e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('urlDisplay').textContent = url;
    document.getElementById('qrSection').classList.add('visible');
  }
</script>
</body>
</html>
